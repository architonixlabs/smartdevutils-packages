# SmartDevUtils Playground: static Angular app under /playground/ (container smartdevutils-playground, port 8080).
# The site nginx proxies /playground/ here unchanged and adds only HSTS, so every header the browser needs is set
# below. nginx drops inherited add_header lines in any location that declares its own, so each location repeats
# the full set it needs.
#
# Two header sets:
#   app pages   CSP for the Angular app: own scripts only, frames only from this origin (the sandbox).
#   sandbox     /playground/sandbox.html runs visitor code: `sandbox allow-scripts` gives it an opaque origin even
#               if it is opened directly, scripts only from here and blob: (the compiled snippet), no frames of it
#               on other sites.
# /playground/runtime/ holds the import-map bundles; the opaque-origin sandbox loads them as cross-origin
# modules, so they (and only they) carry Access-Control-Allow-Origin: *.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml text/plain;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = /playground {
        return 301 /playground/;
    }

    # Only /playground/ is served; the site owns everything else.
    location / {
        return 404;
    }

    # App pages, docs.json, favicon and the SPA fallback (deep links such as /playground/core/hashing/sha256).
    # script-src is 'self' only: angular.json turns off critical-CSS inlining (optimization.styles.inlineCritical:
    # false), which would otherwise add an inline <script> to index.html that this policy blocks (page unstyled).
    location /playground/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://stackblitz.com; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /playground/index.html;
    }

    # Content-hashed Angular output: main-XXXXXXXX.js, chunk-XXXXXXXX.js, styles-XXXXXXXX.css, media/… (the 8-char
    # hash may itself contain - or _, e.g. chunk-DS8nf-JK.js). Quoted: nginx reads an unquoted { as a block.
    location ~ "^/playground/(?:media/)?[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|ttf|svg|png|jpg|webp)$" {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The sandbox page. No X-Frame-Options: the app frames it; frame-ancestors 'self' limits who else can.
    location = /playground/sandbox.html {
        add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self' data:; connect-src 'self' https:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The sandbox page script (not hashed: revalidate).
    location = /playground/sandbox.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Runtime bundles: hashed file names, cached for a year. ^~ keeps the regex location above out of it.
    location ^~ /playground/runtime/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;

        # importmap.json and the theme stylesheets keep fixed names: revalidate.
        location ~ ^/playground/runtime/(?:importmap\.json|theme/[^/]+\.css)$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
    }
}

    <meta name="referrer" content="no-referrer" />
    <title>SmartDevUtils Playground sandbox</title>

      body { margin: 0; padding: 12px; font-family: system-ui, sans-serif; }
    </style>
    <script src="sandbox.js" defer></script>
  </head>

  </body>

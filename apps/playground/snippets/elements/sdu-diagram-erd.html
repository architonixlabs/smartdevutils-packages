<!-- ---
title: Draw an ER diagram generated by core
entry: elements/sdu-diagram
--- -->
<sdu-diagram label="Shop schema"></sdu-diagram>

<script type="module">
  import '@smartdevutils/elements/diagram'
  import { ddlToErd } from '@smartdevutils/core/diagrams'

  const erd = ddlToErd(`
    CREATE TABLE customers (id INT PRIMARY KEY, email VARCHAR(200));
    CREATE TABLE orders (id INT PRIMARY KEY, customer_id INT REFERENCES customers(id), total DECIMAL(10,2));
  `)
  document.querySelector('sdu-diagram').source = erd.output
</script>

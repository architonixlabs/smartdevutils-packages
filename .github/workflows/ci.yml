name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Test with coverage (lcov per package, for SonarQube)
        run: pnpm test:coverage

      - run: pnpm lint

      - name: Size budgets (size-budgets.json)
        run: pnpm size

      - name: Every export loads through import() and require()
        run: pnpm check:dist

      - name: CycloneDX SBOM per package (upload to Dependency-Track from the internal runner)
        run: |
          set -euo pipefail
          mkdir -p sbom
          for dir in packages/*/; do
            name=$(basename "$dir")
            npx --yes @cyclonedx/cdxgen@11 -t js --required-only -o "sbom/$name.cdx.json" "$dir"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-and-sbom
          path: |
            packages/*/coverage/lcov.info
            sbom/*.cdx.json

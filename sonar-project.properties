# SonarQube (org instance on :7001). The token comes from DockerSecurity/code-platform/scan.env
# and is passed to the scanner as SONAR_TOKEN at scan time. Never put it in this file.
sonar.projectKey=smartdevutils-packages
sonar.projectName=SmartDevUtils packages
sonar.sourceEncoding=UTF-8

sonar.sources=packages/core/src,packages/browser/src,packages/react/src,packages/recipes/src,packages/elements/src,packages/angular/src,packages/theme/src,packages/theme/scripts
sonar.tests=packages/core/src,packages/browser/src,packages/react/src,packages/recipes/src,packages/elements/src,packages/angular/src,packages/theme/test,packages/elements/test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/dist/**,**/coverage/**,examples/**

# Run `pnpm test:coverage` first.
sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info,packages/browser/coverage/lcov.info,packages/react/coverage/lcov.info,packages/recipes/coverage/lcov.info,packages/theme/coverage/lcov.info,packages/elements/coverage/lcov.info,packages/angular/coverage/lcov.info
